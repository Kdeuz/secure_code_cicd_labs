name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * *"   # tous les jours à 5 h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262				#v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065		#v5.6.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (bloque sur HIGH)
        run: bandit -r app -lll
